<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARY Clicker ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    color: #805565;
    background:
        radial-gradient(circle at top, #fff8fa, transparent 60%),
        linear-gradient(145deg, #ffe8ef, #f8dce7, #efd2e0);
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
    color: #bd7892;
    text-shadow: 0 2px 4px rgba(255,255,255,.9);
}

.subtitle {
    font-size: 14px;
    color: #b78b9d;
    margin-bottom: 35px;
}

/* KEYCHAIN */

.keychain-area {
    position: relative;
    padding-top: 48px;
    margin: 0 auto 30px;
}

/* METAL KEYRING */

.keyring {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 48px;
    border: 6px solid #c9a7b3;
    border-radius: 50%;
    background: transparent;
    box-shadow:
        inset 0 2px 4px rgba(255,255,255,.9),
        0 3px 5px rgba(150,90,110,.2);
}

.keyring::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 16px;
    border: 5px solid #c9a7b3;
    border-bottom: none;
    border-radius: 15px 15px 0 0;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
}

/* KEYCHAIN BODY */

.keychain {
    position: relative;
    width: 100%;
    padding: 25px 12px 22px;
    border-radius: 30px;
    background: linear-gradient(145deg, #fff5f8, #f3d5e1);
    border: 2px solid #e7bdcd;
    box-shadow:
        0 12px 0 #d9aebe,
        0 18px 25px rgba(145,85,110,.2),
        inset 0 3px 6px white;
}

.keychain-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: #bf8299;
    margin-bottom: 22px;
}

/* BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
}

.button-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
}

/* MECHANICAL BUTTON DESIGN */

.clicker {
    width: 100%;
    aspect-ratio: 1;
    max-width: 76px;
    border: 3px solid rgba(255,255,255,.9);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: clamp(23px, 7vw, 32px);
    font-weight: bold;
    color: white;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

    /* MULTI-TOUCH SUPPORT */
    touch-action: none;
    -webkit-appearance: none;
    appearance: none;

    box-shadow:
        0 7px 0 rgba(160,90,115,.3),
        0 10px 12px rgba(150,80,110,.15),
        inset 0 4px 7px rgba(255,255,255,.7);
    transition:
        transform .07s ease,
        box-shadow .07s ease,
        filter .07s ease;
}

/* INDIVIDUAL BUTTON COLORS */

.button-a {
    background: linear-gradient(145deg, #f7b9cd, #e98eae);
}

.button-r {
    background: linear-gradient(145deg, #e9b4d2, #d58dbb);
}

.button-y {
    background: linear-gradient(145deg, #f4c6d5, #e9a4bb);
}

.button-sun {
    background: linear-gradient(145deg, #f7ce83, #e9ad50);
    font-size: clamp(25px, 7vw, 33px);
}

/* PRESS DOWN EFFECT */

.clicker:active,
.clicker.pressed {
    transform: translateY(6px) scale(.97);
    box-shadow:
        0 1px 0 rgba(160,90,115,.3),
        inset 0 4px 8px rgba(120,50,80,.15);
    filter: brightness(.96);
}

.clicker:focus-visible {
    outline: 3px solid #c27e9a;
    outline-offset: 4px;
}

.button-count {
    margin-top: 15px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #bd8c9e;
}

/* TOTAL COUNTER */

.total-section {
    margin: 35px auto 20px;
}

.total-label {
    font-size: 13px;
    letter-spacing: 2px;
    color: #bd8c9e;
}

.total-count {
    font-family: Arial, sans-serif;
    font-size: 40px;
    font-weight: bold;
    color: #c17e98;
    margin-top: 5px;
    text-shadow: 0 2px 3px white;
}

.message {
    min-height: 25px;
    font-size: 14px;
    color: #b78b9d;
    font-style: italic;
    margin: 18px 0;
}

/* SOUND CHOICE */

.sound-panel {
    margin: 25px auto 22px;
    padding: 16px;
    border: 1px solid #e6bdcc;
    border-radius: 20px;
    background: rgba(255,245,248,.75);
}

.sound-title {
    margin-bottom: 12px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #ad748a;
}

.sound-options {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.sound-option {
    flex: 1;
    padding: 10px 5px;
    border: 1px solid #e6bdcc;
    border-radius: 14px;
    background: #fff8fa;
    color: #a96e84;
    font-family: Georgia, serif;
    font-size: 12px;
    cursor: pointer;
    transition: .15s ease;
}

.sound-option.active {
    background: #edc9d7;
    border-color: #c98ca5;
    color: #805565;
    font-weight: bold;
    box-shadow: inset 0 2px 4px rgba(150,80,110,.1);
}

.sound-option:active {
    transform: scale(.96);
}

.sound-description {
    min-height: 18px;
    margin: 12px 0 0;
    font-size: 11px;
    color: #bd8c9e;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

.control-button {
    padding: 12px 20px;
    border: 1px solid #e6bdcc;
    border-radius: 25px;
    background: #fff5f8;
    color: #a96e84;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #dfb5c4;
    touch-action: manipulation;
}

.control-button:active {
    transform: translateY(3px);
    box-shadow: none;
}

.footer {
    margin-top: 30px;
    font-size: 12px;
    color: #c19aaa;
}

/* FLOATING EFFECT */

.sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    font-size: 19px;
    animation: floatUp .8s ease-out forwards;
}

@keyframes floatUp {
    0% {
        opacity: 1;
        transform: translateY(0) scale(.7);
    }

    100% {
        opacity: 0;
        transform: translateY(-65px) scale(1.4);
    }
}

@media(max-width:360px) {
    .keychain {
        padding: 22px 8px 18px;
    }

    .buttons {
        gap: 6px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>ARY Clicker ♡</h1>

    <p class="subtitle">
        A little click, a little comfort.
    </p>

    <div class="keychain-area">

        <div class="keyring"></div>

        <div class="keychain">

            <div class="keychain-label">
                MADE WITH LOVE ♡
            </div>

            <div class="buttons">

                <div class="button-wrapper">
                    <button class="clicker button-a"
                        onpointerdown="clickButton('A', this)">
                        A
                    </button>
                    <div class="button-count" id="count-A">0 clicks</div>
                </div>

                <div class="button-wrapper">
                    <button class="clicker button-r"
                        onpointerdown="clickButton('R', this)">
                        R
                    </button>
                    <div class="button-count" id="count-R">0 clicks</div>
                </div>

                <div class="button-wrapper">
                    <button class="clicker button-y"
                        onpointerdown="clickButton('Y', this)">
                        Y
                    </button>
                    <div class="button-count" id="count-Y">0 clicks</div>
                </div>

                <div class="button-wrapper">
                    <button class="clicker button-sun"
                        onpointerdown="clickButton('SUN', this)">
                        🌻
                    </button>
                    <div class="button-count" id="count-SUN">0 clicks</div>
                </div>

            </div>

        </div>

    </div>

    <div class="total-section">

        <div class="total-label">TOTAL CLICKS</div>

        <div class="total-count" id="total-count">0</div>

    </div>

    <div class="message" id="message">
        Go ahead, give the buttons a little press. ♡
    </div>

    <!-- SOUND CHOICE -->

    <div class="sound-panel">

        <div class="sound-title">CHOOSE YOUR SOUND ♡</div>

        <div class="sound-options">

            <button class="sound-option active"
                id="clicky"
                onclick="changeSound('clicky')">
                Clicky
            </button>

            <button class="sound-option"
                id="tactile"
                onclick="changeSound('tactile')">
                Tactile
            </button>

            <button class="sound-option"
                id="linear"
                onclick="changeSound('linear')">
                Linear
            </button>

        </div>

        <p class="sound-description" id="sound-description">
            Crisp and satisfying mechanical clicks.
        </p>

    </div>

    <div class="controls">

        <button class="control-button"
            onclick="toggleSound()"
            id="sound-button">
            🔊 Sound On
        </button>

        <button class="control-button"
            onclick="resetCounter()">
            ↻ Reset Counter
        </button>

    </div>

    <div class="footer">
        Just click, relax, and enjoy the little things. ☁️
    </div>

</div>

<script>

// CLICK COUNTERS

let counts = {
    A: 0,
    R: 0,
    Y: 0,
    SUN: 0
};

let totalClicks = 0;
let soundEnabled = true;
let currentSound = "clicky";

let audioContext = null;


// CREATE AUDIO CONTEXT

function getAudioContext() {

    if (!audioContext) {

        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return null;

        audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}


// CREATE NOISE IMPACT

function makeImpact(ctx, time, settings) {

    const duration = settings.duration || 0.05;
    const size = Math.floor(ctx.sampleRate * duration);

    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < size; i++) {

        const fade = Math.pow(
            1 - i / size,
            settings.fade || 3
        );

        data[i] = (Math.random() * 2 - 1) * fade;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = settings.filterType || "highpass";
    filter.frequency.value = settings.filter || 1600;

    const noiseGain = ctx.createGain();

    noiseGain.gain.setValueAtTime(settings.volume, time);

    noiseGain.gain.exponentialRampToValueAtTime(
        0.001,
        time + duration
    );

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(ctx.destination);

    noise.start(time);
    noise.stop(time + duration);

    if (settings.frequency) {

        const oscillator = ctx.createOscillator();
        const oscGain = ctx.createGain();

        oscillator.type = settings.wave || "triangle";

        oscillator.frequency.setValueAtTime(
            settings.frequency,
            time
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            settings.frequency * (settings.pitchEnd || 0.5),
            time + duration
        );

        oscGain.gain.setValueAtTime(
            settings.volume * (settings.toneVolume || 0.6),
            time
        );

        oscGain.gain.exponentialRampToValueAtTime(
            0.001,
            time + duration
        );

        oscillator.connect(oscGain);
        oscGain.connect(ctx.destination);

        oscillator.start(time);
        oscillator.stop(time + duration);
    }
}


// SOFT KEYBOARD TONE

function makeSoftTone(ctx, time, settings) {

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = settings.wave || "sine";

    oscillator.frequency.setValueAtTime(
        settings.frequency,
        time
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        settings.endFrequency || settings.frequency * 0.8,
        time + settings.duration
    );

    gain.gain.setValueAtTime(0.0001, time);

    gain.gain.linearRampToValueAtTime(
        settings.volume,
        time + settings.attack
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        time + settings.duration
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(time);
    oscillator.stop(time + settings.duration + 0.01);
}


// CLICKY SOUND - ORIGINAL ARY SOUND

function playClicky(ctx, now) {

    function makeOriginalImpact(time, volume, frequency) {

        const duration = 0.035;

        const buffer = ctx.createBuffer(
            1,
            Math.floor(ctx.sampleRate * duration),
            ctx.sampleRate
        );

        const data = buffer.getChannelData(0);

        for (let i = 0; i < data.length; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = frequency;

        const noiseGain = ctx.createGain();

        noiseGain.gain.setValueAtTime(volume, time);

        noiseGain.gain.exponentialRampToValueAtTime(
            0.001,
            time + duration
        );

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        noise.start(time);
        noise.stop(time + duration);

        const oscillator = ctx.createOscillator();
        const bodyGain = ctx.createGain();

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(190, time);

        oscillator.frequency.exponentialRampToValueAtTime(
            90,
            time + 0.04
        );

        bodyGain.gain.setValueAtTime(volume * 0.5, time);

        bodyGain.gain.exponentialRampToValueAtTime(
            0.001,
            time + 0.045
        );

        oscillator.connect(bodyGain);
        bodyGain.connect(ctx.destination);

        oscillator.start(time);
        oscillator.stop(time + 0.05);
    }

    makeOriginalImpact(now, 0.45, 1200);
    makeOriginalImpact(now + 0.045, 0.23, 1800);
}


// TACTILE SOUND - FROM EISE CODE

function playTactile(ctx, now) {

    // Soft, rounded mechanical tap
    makeImpact(ctx, now, {
        volume: 0.20,
        frequency: 650,
        filter: 2400,
        filterType: "highpass",
        duration: 0.035,
        toneVolume: 0.45,
        pitchEnd: 0.8,
        fade: 4
    });

    // Delicate high-pitched tick
    makeImpact(ctx, now + 0.035, {
        volume: 0.09,
        frequency: 1450,
        filter: 3200,
        duration: 0.025,
        toneVolume: 0.35,
        pitchEnd: 0.9,
        fade: 5
    });
}


// LINEAR SOUND - PREVIOUS ARY TACTILE SOUND

function playLinear(ctx, now) {

    // Gentle, rounded keyboard press
    makeImpact(ctx, now, {
        volume: 0.12,
        frequency: 900,
        filter: 2800,
        duration: 0.045,
        toneVolume: 0.3,
        pitchEnd: 0.85,
        fade: 4
    });

    // Soft release tick
    makeImpact(ctx, now + 0.035, {
        volume: 0.045,
        frequency: 1450,
        filter: 3400,
        duration: 0.025,
        toneVolume: 0.25,
        pitchEnd: 0.9,
        fade: 5
    });
}


// PLAY SELECTED SOUND

function playMechanicalClick() {

    if (!soundEnabled) return;

    const ctx = getAudioContext();

    if (!ctx) return;

    const now = ctx.currentTime;

    if (currentSound === "clicky") {

        playClicky(ctx, now);

    } else if (currentSound === "tactile") {

        playTactile(ctx, now);

    } else if (currentSound === "linear") {

        playLinear(ctx, now);

    }
}


// SOUND SELECTION

const soundDescriptions = {

    clicky: "Crisp and satisfying mechanical clicks.",

    tactile: "A soft, rounded tap with a delicate little tick. ♡",

    linear: "A gentle, muted keyboard press. ☁️"
};

function changeSound(type) {

    currentSound = type;

    document.querySelectorAll(".sound-option").forEach(button => {
        button.classList.remove("active");
    });

    document.getElementById(type).classList.add("active");

    document.getElementById("sound-description").textContent =
        soundDescriptions[type];

    playMechanicalClick();
}


// MESSAGES

const messages = [
    "A little click for a little happiness. ♡",
    "Take your time. There's no rush. ☁️",
    "One more click? Just because. ✨",
    "Hope this makes you smile. 🌷",
    "Sending you a little sunshine. 🌻",
    "You're doing just fine. ♡"
];


// CLICK FUNCTION

function clickButton(type, button) {

    counts[type]++;
    totalClicks++;

    document.getElementById("count-" + type).textContent =
        counts[type] + (counts[type] === 1 ? " click" : " clicks");

    document.getElementById("total-count").textContent =
        totalClicks;

    playMechanicalClick();

    button.classList.add("pressed");

    setTimeout(() => {
        button.classList.remove("pressed");
    }, 110);

    createSparkle(button);

    if (type === "SUN") {

        document.getElementById("message").textContent =
            "A little sunshine just for you. 🌻";

    } else if (totalClicks % 10 === 0) {

        document.getElementById("message").textContent =
            messages[Math.floor(Math.random() * messages.length)];

    }
}


// SPARKLE EFFECT

function createSparkle(button) {

    const rect = button.getBoundingClientRect();

    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";

    sparkle.textContent =
        Math.random() > 0.5 ? "✨" : "♡";

    sparkle.style.left =
        (rect.left + rect.width / 2) + "px";

    sparkle.style.top =
        (rect.top + rect.height / 2) + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => {
        sparkle.remove();
    }, 800);
}


// SOUND TOGGLE

function toggleSound() {

    soundEnabled = !soundEnabled;

    document.getElementById("sound-button").textContent =
        soundEnabled ? "🔊 Sound On" : "🔇 Sound Off";
}


// RESET COUNTER

function resetCounter() {

    counts = {
        A: 0,
        R: 0,
        Y: 0,
        SUN: 0
    };

    totalClicks = 0;

    document.getElementById("total-count").textContent = "0";

    for (const type in counts) {
        document.getElementById("count-" + type).textContent =
            "0 clicks";
    }

    document.getElementById("message").textContent =
        "Fresh start! Enjoy your little clicker. ♡";
}

</script>

</body>
</html>
